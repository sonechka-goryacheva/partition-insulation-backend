services:
  minio:
    container_name: minio_storage
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: rootpassword
      MINIO_CONSOLE_ADDRESS: ":9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

  postgres:
    container_name: partition_postgres
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: partition_admin
      POSTGRES_PASSWORD: partitionpass
      POSTGRES_DB: partition_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  adminer:
    container_name: partition_adminer
    image: adminer:latest
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  minio-data:
    external: true
    name: partition-lab_minio-data
  postgres-data:
