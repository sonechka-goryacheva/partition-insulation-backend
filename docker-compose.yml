services:
  minio:
    container_name: minio_storage
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: rootpassword
      MINIO_CONSOLE_ADDRESS: ":9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

  postgres:
    container_name: partition_postgres
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: partition_admin
      POSTGRES_PASSWORD: partitionpass
      POSTGRES_DB: partition_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  adminer:
    container_name: partition_adminer
    image: adminer:latest
    ports:
      - "8081:8080"
    depends_on:
      - postgres

  # Хранилище сессий (ЛР-4)
  redis:
    container_name: partition_redis
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    # сохранение на диск раз в 20 с при изменениях, пароль из .env
    command: redis-server --save 20 1 --loglevel warning --requirepass ${REDIS_PASSWORD}
    environment:
      # redis-cli внутри контейнера входит с паролем автоматически
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data

volumes:
  minio-data:
    external: true
    name: partition-lab_minio-data
  postgres-data:
  redis-data:
    driver: local
